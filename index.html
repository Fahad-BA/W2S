<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple South Korean Won to Saudi Riyal converter.">
  <title>KRW to SAR</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="converter" aria-labelledby="title">
    <header class="header">
      <p class="eyebrow">Currency converter</p>
      <h1 id="title">KRW <span aria-hidden="true">↔</span> SAR</h1>
      <p class="subtitle">South Korean Won to Saudi Riyal</p>
    </header>

    <form class="converter-form" novalidate>
      <label class="currency-field" for="krw">
        <span class="currency-label"><span class="flag" aria-hidden="true">🇰🇷</span> South Korean Won <small>KRW</small></span>
        <span class="input-wrap"><span class="currency-symbol" aria-hidden="true">₩</span><input id="krw" name="krw" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></span>
      </label>

      <div class="swap" aria-hidden="true">⇅</div>

      <label class="currency-field" for="sar">
        <span class="currency-label"><span class="flag" aria-hidden="true">🇸🇦</span> Saudi Riyal <small>SAR</small></span>
        <span class="input-wrap"><span class="currency-symbol" aria-hidden="true">ر.س</span><input id="sar" name="sar" type="text" inputmode="decimal" placeholder="0" autocomplete="off"></span>
      </label>
    </form>

    <p class="rate">1 KRW = 0.0028038 SAR</p>
  </main>
</body>
</html>
